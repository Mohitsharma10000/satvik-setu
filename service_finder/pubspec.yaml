name: service_finder
description: Verified Local Service Finder - Connect with verified local service providers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^4.9.0
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.1.0
  firebase_messaging: ^16.2.2
  firebase_auth: ^6.5.1
  google_sign_in: ^6.2.2
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Navigation
  go_router: ^14.8.1
  
  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  
  # Camera & Image
  image_picker: ^1.1.2
  
  # Payment
  razorpay_flutter: ^1.3.7
  
  # Utils
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_cache_manager: ^3.4.1
  geolocator: ^13.0.2
  shared_preferences: ^2.5.2
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
