name: service_finder_admin
description: Verified Local Service Finder - Admin Dashboard for managing providers, categories, and donations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^4.9.0
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.1.0
  firebase_auth: ^6.5.1
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Navigation
  go_router: ^14.8.1
  
  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  data_table_2: ^2.5.15
  fl_chart: ^0.69.2
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  file_picker: ^8.1.7
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
